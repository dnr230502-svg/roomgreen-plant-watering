<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>룸그린 물주기 알림판</title><style>:root{--g:#42c85d;--ink:#233044;--mut:#6c7686;--bg:#f4f8f3;--line:#dbe4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}header{background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:2}nav{max-width:980px;margin:auto;padding:14px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}b{font-size:20px;margin-right:auto}button,input,select{font:inherit}button{cursor:pointer;border:2px solid var(--line);border-radius:12px;background:#fff;padding:9px 13px;font-weight:800;box-shadow:0 3px 0 #cbd5cd}button:active{transform:translateY(2px);box-shadow:none}.on,.primary{background:var(--g);border-color:#2aa642;color:#073d12}.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;background:#e2f7e6;border:2px solid #b6e5bd;border-radius:24px;padding:24px;margin-bottom:20px}.hero h1{font-size:clamp(30px,6vw,56px);line-height:1.08;margin:12px 0}.hero p{color:var(--mut);font-size:17px}.hero-art{min-height:210px;border:2px solid #b6e5bd;border-radius:22px;background:#d4f1da;display:grid;place-items:center;font-size:100px;position:relative}.hero-art small{position:absolute;right:16px;bottom:16px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 11px;font-size:14px;font-weight:900;box-shadow:0 3px 0 var(--ink);transform:rotate(4deg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.card,.panel{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 0 #cbd5cd}.stat strong{display:block;font-size:30px;margin-top:5px}.muted{color:var(--mut);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card h3{margin:0;font-size:20px}.top{display:flex;gap:12px;align-items:center}.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px}.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:900;margin:14px 0 10px}.today{background:#dff7e5;color:#166629}.late{background:#ffe1e3;color:#9c222b}.future{background:#fff2c7;color:#755800}.actions{display:flex;gap:8px}.actions button{flex:1}.hidden{display:none}.panel{max-width:700px;margin:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field.full{grid-column:1/-1}.field input,.field select{height:46px;border:2px solid var(--line);border-radius:12px;padding:0 10px}.colors{display:flex;gap:9px;flex-wrap:wrap}.color{width:34px;height:34px;padding:0;border-radius:10px}.sel{outline:3px solid var(--ink)}.cal{margin:22px 0}.calhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{font-size:12px;color:var(--mut);text-align:center;margin:12px 0 5px}.day{min-height:57px;padding:7px;border:2px solid var(--line);border-radius:10px}.watered{background:#ddf7e3;border-color:#9dddab}.dim{opacity:.4}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);background:#233044;color:#fff;padding:12px 16px;border-radius:999px;transition:.25s;z-index:5}.show{transform:translate(-50%,0)}.toast button{padding:4px 9px;margin-left:8px;color:#fff;background:transparent;border-color:#fff;box-shadow:none}@media(max-width:650px){.stats,.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.field.full{grid-column:auto}nav{align-items:flex-start}nav b{width:100%}} </style></head><body><header><nav><b>🪴 룸그린 알림판</b><button class="on" data-v="today">오늘 물주기</button><button data-v="plants">내 식물</button><button data-v="form">식물 추가</button></nav></header><main class="wrap"><section id="today"><div class="hero"><div><span>기숙사 방 식물 관리</span><h1>오늘도 물 한 컵,<br><em>초록 생활!</em></h1><p>식물마다 다른 물주기를 잊지 않도록 오늘 챙길 화분과 다음 예정일을 알려드려요.</p></div><div class="hero-art">🌿<small>오늘도 쑥쑥!</small></div></div><div id="stats" class="stats"></div><h2>오늘 챙길 화분</h2><div id="due" class="grid"></div></section><section id="plants" class="hidden"><h2>내 식물 모아보기</h2><div class="panel cal"><div class="calhead"><h3 id="ct">물주기 캘린더</h3><select id="pick"></select><button id="prev">‹</button><button id="next">›</button></div><div class="week"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div id="days" class="days"></div><p class="muted">초록 칸은 선택한 식물에 물을 준 날입니다.</p></div><div id="all" class="grid"></div></section><section id="form" class="hidden"><div class="panel"><h2 id="ft">식물 친구 추가</h2><form id="formx"><div class="row"><div class="field full"><label>식물 이름</label><input id="name" required placeholder="예: 몬스테라"></div><div class="field"><label>물주는 간격(며칠마다)</label><input id="int" type="number" min="1" required value="7"></div><div class="field"><label>마지막 물준 날짜</label><input id="last" type="date" required></div><div class="field full"><label>식물 카드 색상</label><div id="colors" class="colors"></div></div></div><button type="button" id="cancel">취소</button> <button class="primary">저장하기</button></form></div><div id="hist" class="panel hidden"></div></section></main><div id="toast" class="toast"></div><script>const K='roomgreen-final';const cs=['#78d68a','#a8dc3a','#7cc8f5','#ffc933','#ff9838','#ff9ca0','#b69aff'];const em=['🌿','🪴','🌵','🌱','🍀','🌻'];let ps=JSON.parse(localStorage.getItem(K)||'null')||[{id:1,name:'몬스테라',int:7,last:d(-7),color:cs[0],h:[d(-7),d(-14)]},{id:2,name:'스투키',int:14,last:d(-5),color:cs[2],h:[d(-5)]}];let edit=null,sel=cs[0],cd=new Date(),pick=null,undo=null;function d(n=0){let x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}function add(x,n){let z=new Date(x+'T00:00:00');z.setDate(z.getDate()+n);return z.toISOString().slice(0,10)}function f(x){return x?x.replaceAll('-','.'):'-'}function st(p){let x=Math.round((new Date(d())-new Date(add(p.last,p.int)))/864e5);return x>0?['late',x+'일 지남']:x===0?['today','오늘 물주기']:['future',-x+'일 후 물주기']}function save(){localStorage.setItem(K,JSON.stringify(ps))}function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function card(p){let s=st(p),nx=add(p.last,p.int);return '<article class="card"><div class="top"><div class="ico" style="background:'+p.color+'">'+em[p.id%em.length]+'</div><div><h3>'+esc(p.name)+'</h3><span class="muted">'+p.int+'일마다 물주기</span></div></div><span class="badge '+s[0]+'">'+s[1]+'</span><div class="muted">최근 물준 날 '+f(p.last)+' · 예정일 '+f(nx)+'</div><div class="actions"><button class="primary" data-a="water" data-id="'+p.id+'">💧 물 줌</button><button data-a="edit" data-id="'+p.id+'">수정</button></div></article>'}function render(){let due=ps.filter(p=>st(p)[0]!=='future');stats.innerHTML='<div class="stat">오늘 물줄 식물<strong>'+ps.filter(p=>st(p)[0]=='today').length+'개</strong></div><div class="stat">물주기 지연<strong>'+ps.filter(p=>st(p)[0]=='late').length+'개</strong></div><div class="stat">내 화분<strong>'+ps.length+'개</strong></div>';document.getElementById('due').innerHTML=due.length?due.map(card).join(''):'<div class="panel">오늘은 모두 챙겼어요! 🎉</div>';document.getElementById('all').innerHTML=ps.length?ps.map(card).join(''):'<div class="panel">식물을 추가해 보세요.</div>';renderCal()}function view(v){['today','plants','form'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v!=='form')render()}function toast(t,u=false){let x=document.getElementById('toast');x.innerHTML=esc(t)+(u?' <button data-a="undo">되돌리기</button>':'');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3500)}function water(id){let p=ps.find(x=>x.id===id);undo={id, last:p.last,h:[...p.h]};p.last=d();p.h=[...p.h,d()];save();render();toast(p.name+' 물주기 완료! 오늘도 초록 잔치 개막! 🌿',true)}function openForm(id){edit=id||null;let p=ps.find(x=>x.id===id);name.value=p?.name||'';int.value=p?.int||7;last.value=p?.last||d();sel=p?.color||cs[0];ft.textContent=id?'식물 정보 수정':'식물 친구 추가';colors.innerHTML=cs.map(c=>'<button type="button" class="color '+(c===sel?'sel':'')+'" style="background:'+c+'" data-c="'+c+'"></button>').join('');hist.classList.toggle('hidden',!p);if(p)hist.innerHTML='<h3>💧 '+esc(p.name)+' 물주기 기록</h3><p class="muted">기록을 수정하거나 잘못된 기록을 삭제할 수 있어요.</p>'+[...new Set(p.h)].sort().reverse().map(x=>'<p>'+f(x)+' <button data-a="he" data-id="'+id+'" data-date="'+x+'">수정</button> <button data-a="hd" data-id="'+id+'" data-date="'+x+'">삭제</button></p>').join('');view('form')}function renderCal(){let q=document.getElementById('pick');if(!ps.length){q.innerHTML='<option>없음</option>';return}if(!pick||!ps.some(p=>p.id===pick))pick=ps[0].id;q.innerHTML=ps.map(p=>'<option value="'+p.id+'" '+(p.id===pick?'selected':'')+'>'+esc(p.name)+'</option>').join('');let p=ps.find(x=>x.id===pick),y=cd.getFullYear(),m=cd.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate(),arr=[];for(let i=0;i<42;i++){let num=i-off+1,z=new Date(y,m,num),v=z.toISOString().slice(0,10);arr.push('<div class="day '+(num<1||num>n?'dim ':'')+((p.h||[]).includes(v)?'watered':'')+'"><b>'+z.getDate()+'</b>'+((p.h||[]).includes(v)?'<br><small>💧</small>':'')+'</div>')}document.getElementById('ct').textContent=y+'년 '+(m+1)+'월 물주기';document.getElementById('days').innerHTML=arr.join('')}document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(b){let a=b.dataset.a,id=+b.dataset.id;if(a==='water')water(id);if(a==='undo'){let p=ps.find(x=>x.id===undo.id);p.last=undo.last;p.h=undo.h;save();render();toast('방금 물준 기록을 취소했어요.');}if(a==='edit')openForm(id);if(a==='he'){let p=ps.find(x=>x.id===id),v=prompt('YYYY-MM-DD 날짜',b.dataset.date);if(v){p.h=p.h.map(x=>x===b.dataset.date?v:x).sort();p.last=p.h[p.h.length-1];save();openForm(id);render()}}if(a==='hd'){let p=ps.find(x=>x.id===id);p.h=p.h.filter(x=>x!==b.dataset.date);p.last=p.h[p.h.length-1]||d();save();openForm(id);render()}}let c=e.target.closest('[data-c]');if(c){sel=c.dataset.c;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('sel',x.dataset.c===sel))}});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));document.getElementById('cancel').onclick=()=>view('today');document.getElementById('prev').onclick=()=>{cd.setMonth(cd.getMonth()-1);renderCal()};document.getElementById('next').onclick=()=>{cd.setMonth(cd.getMonth()+1);renderCal()};document.getElementById('pick').onchange=e=>{pick=+e.target.value;renderCal()};document.getElementById('formx').onsubmit=e=>{e.preventDefault();let p;if(edit){p=ps.find(x=>x.id===edit);p.name=name.value.trim();p.int=+int.value;p.last=last.value;p.color=sel;if(!p.h.includes(p.last))p.h.push(p.last)}else{p={id:Date.now(),name:name.value.trim(),int:+int.value,last:last.value,color:sel,h:[last.value]};ps.push(p)}save();toast('저장했어요!');e.target.reset();view('today')};colors.innerHTML=cs.map(c=>'<button type="button" class="color" style="background:'+c+'" data-c="'+c+'"></button>').join('');last.value=d();render();</script></body></html>
